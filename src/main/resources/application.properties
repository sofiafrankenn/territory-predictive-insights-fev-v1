spring.application.name=territory-predictive-insights
spring.main.banner-mode=off
logging.level.root=WARN

# H2 em arquivo: o histórico sobrevive ao reiniciar o programa
spring.datasource.url=jdbc:h2:file:./data/territory;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Dados do território monitorado (população aproximada do bairro, segundo reportagem do Brasil de Fato)
territorio.regiao=Jardim Pantanal (Jardim Helena, Zona Leste) - S\u00e3o Paulo/SP
territorio.populacao=45000
territorio.codigo-acesso=1234
